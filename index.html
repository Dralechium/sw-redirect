<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>theos RNG</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}
.header h1{
  color:#42ff29;
  text-shadow:0 0 10px #42ff29;
}
.header{
  text-align:center;
  padding:15px;
  background:#111;
  border-bottom:2px solid #222;
}

.stats{
  display:flex;
  justify-content:center;
  gap:40px;
}

.roll-area{
  text-align:center;
  padding:30px;
}

/* ROLL DISPLAY */
#display{
  width:360px;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:#181818;
  transition:0.2s ease;
}

#display img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
}

#name{
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

#odds{ color:#aaa; }

.rollBtn{
  padding:18px 70px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#5865F2;
  color:white;
  margin-top:15px;
}

/* INVENTORY */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
  padding:20px;
}

.card{
  border-radius:12px;
  text-align:center;
  padding:10px;
  position:relative;
  overflow:hidden;
  transition:0.3s;
  background:#1a1a1a;
}

.card img{
  width:70px;
  height:70px;
  border-radius:50%;
}

/* rarity glow + color themes */
/* INVENTORY CARD RARITIES */
.card.common{
  box-shadow:0 0 8px gray;
  background:linear-gradient(145deg,#1a1a1a,#2a2a2a);
}

.card.rare{
  box-shadow:0 0 12px #4da6ff;
  background:linear-gradient(145deg,#0b1a2a,#123a66);
}

.card.epic{
  box-shadow:0 0 18px #b84dff;
  background:linear-gradient(145deg,#1a0b2a,#3a1266);
}

.card.legendary{
  box-shadow:0 0 25px gold;
  background:linear-gradient(145deg,#2a220b,#665012);
}

.card.mythic{
  box-shadow:0 0 35px red;
  background:linear-gradient(145deg,#2a0b0b,#661212);
}

/* PREVIEW SCREEN RARITIES */
#display.common{
  background:linear-gradient(145deg,#1a1a1a,#2a2a2a);
  box-shadow:0 0 15px gray;
}

#display.rare{
  background:linear-gradient(145deg,#0b1a2a,#123a66);
  box-shadow:0 0 20px #4da6ff;
}

#display.epic{
  background:linear-gradient(145deg,#1a0b2a,#3a1266);
  box-shadow:0 0 25px #b84dff;
}

#display.legendary{
  background:linear-gradient(145deg,#2a220b,#665012);
  box-shadow:0 0 30px gold;
}

#display.mythic{
  background:linear-gradient(145deg,#2a0b0b,#661212);
  box-shadow:0 0 40px red;
}

/* locked */
.locked img{
  filter:blur(8px) grayscale(1);
  transform:scale(1.1);
}

.lockIcon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:26px;
}

.card:hover{
  transform: scale(1.03);
}

</style>
</head>

<body>

<div class="header">
  <h1>theos RNG</h1>

  <div class="stats">
    <div>Rolls: <span id="rolls">0</span></div>
    <div>Best: <span id="best">None</span></div>
  </div>
</div>

<div class="roll-area">

  <div id="display">
    <img id="img" src="https://i.pravatar.cc/150">
    <div id="name">Press Roll</div>
    <div id="odds"></div>
  </div>

  <button class="rollBtn" onclick="roll()">ROLL</button>

</div>

<div id="inventory" class="grid"></div>

<script>

/* VIEWERS */
const viewers = [
  {name:"duckwithsunnies", odds:2, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/6ef3b0ef-bc0b-463d-a3d9-1f2a646a534f-profile_image-70x70.png"},
  {name:"ilee_ez", odds:4, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/e0efcfce-7516-4589-9bcf-5c6ec63a8a76-profile_image-70x70.png"},
  {name:"ztatsukii_", odds:8, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/4fd5ffe5-6799-4f4e-b470-f1420f1caee4-profile_image-70x70.jpeg"},
  {name:"Shunkohh", odds:16, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/2a1751b4-a94c-4c97-9fa7-3168b6a2768f-profile_image-70x70.png"},
  {name:"41unc", odds:25, image:"https://cdn.discordapp.com/avatars/820266716537815040/396a0ee557222daf4c58ed975aad5e59.webp?size=1024"},
  {name:"AbyssFDK", odds:50, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/84332b83-3f01-4ce3-9860-abb0a671fb5c-profile_image-70x70.jpeg"},
  {name:"gmdbon", odds:100, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/45da4302-a7a6-4bc8-a320-f7ebac40d84f-profile_image-70x70.png"},
  {name:"midgatal", odds:500, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/bc185f86-30d2-4422-b547-5f4e3c504d54-profile_image-70x70.png"},
  {name:"IVDrale", odds:1000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/6e71f426-65ca-4914-b6e8-0e5499f032cb-profile_image-70x70.png"},
  {name:"Christ_Is_God", odds:5000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/98b31c09-fa8b-4318-88bd-ef8a0443b772-profile_image-70x70.png"},
  {name:"theosGMD", odds:10000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/0ffc8233-6b32-411e-bfbd-4167c09cc2a2-profile_image-70x70.png"}
];

/* DATA */
let inventory = JSON.parse(localStorage.getItem("inv")||"{}");
let rolls = Number(localStorage.getItem("rolls")||0);
let best = JSON.parse(localStorage.getItem("best")) || null;

document.getElementById("rolls").innerText = rolls;

/* RARITY */
function rarity(o){
  if(o<=5) return "common";
  if(o<=25) return "rare";
  if(o<=100) return "epic";
  if(o<=1000) return "legendary";
  return "mythic";
}

/* RNG */
function pick(p){
  const sorted=[...viewers].sort((a,b)=>b.odds-a.odds);

  let dropZone = p > 0.7 && p < 0.9;

  for(let v of sorted){
    if(dropZone && v.odds >= 100){
      if(Math.random() < 1/(v.odds/2)) return v;
    }
    if(Math.floor(Math.random()*v.odds)===0) return v;
  }

  return viewers[0];
}

/* ROLL */
let running=false;

function roll(){
  if(running) return;
  running=true;

  rolls++;
  document.getElementById("rolls").innerText = rolls;

  const start = performance.now();
  const rollDuration = 3000;

  function frame(t){
    let p = (t - start) / rollDuration;
    if(p > 1) p = 1;

    let curve = 1 - Math.pow(1 - p, 4);
    let delay = 35 + (220 * curve);

    if(p < 1){

      let v = viewers[Math.floor(Math.random()*viewers.length)];
      show(v);

      setTimeout(()=>requestAnimationFrame(frame), delay);

    } else {

      let final = pick(p);
      show(final);
      finish(final);
      running = false;
    }
  }

  requestAnimationFrame(frame);
}

/* 🔥 FIX: RARITY SYNCED DISPLAY UPDATE */
function show(v){
  const display = document.getElementById("display");

  document.getElementById("img").src = v.image;
  document.getElementById("name").innerText = v.name;
  document.getElementById("odds").innerText = "1 in " + v.odds;

  display.className = "";
  display.classList.add(rarity(v.odds));
}
/* FINISH */
function finish(v){

  inventory[v.name] = (inventory[v.name] || 0) + 1;

  if(!best || v.odds > best.odds){
    best = {
      name: v.name,
      odds: v.odds
    };

    document.getElementById("best").innerText =
      `${best.name} (1/${best.odds})`;
  }

  save();
  render();
}

  save();
  render();
}

/* INVENTORY */
function render(){
  let inv = document.getElementById("inventory");
  inv.innerHTML = "";

  for(let v of viewers){
    let owned = inventory[v.name];

    inv.innerHTML += `
      <div class="card ${owned ? rarity(v.odds) : "locked"}">
        <img src="${owned ? v.image : "https://i.imgur.com/8QfQ3vR.png"}">
        ${!owned ? '<div class="lockIcon">🔒</div>' : ""}
        <div>${owned ? v.name : "???"}</div>
        <div>${owned ? "1 in "+v.odds : "Locked"}</div>
        <div>${owned ? "x"+owned : ""}</div>
      </div>
    `;
  }
}

function save(){
  localStorage.setItem("inv", JSON.stringify(inventory));
  localStorage.setItem("rolls", rolls);
  localStorage.setItem("best", JSON.stringify(best));
}

render();

</script>

</body>
</html>
