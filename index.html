<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>theos RNG</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron', Arial, sans-serif;
  background:#0b0b0b;
  color:white;
  overflow:hidden;
}

/* APP WRAPPER */
.app{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
.header{
  text-align:center;
  padding:15px;
  background:#111;
  border-bottom:2px solid #222;
  width:100%;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 20px;
}

.hudBox{
  padding:12px 18px;
  border-radius:12px;
  background:#1a1a1a;
  border:2px solid #42ff29;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 0 10px rgba(66,255,41,0.3);
}

/* NAV */
.nav{
  position:relative;
  display:flex;
  justify-content:center;
  margin:15px 0;
  border:2px solid #42ff29;
  border-radius:999px;
  background:rgba(0,0,0,0.35);
  overflow:hidden;
}

.nav-inner{
  display:flex;
  position:relative;
}

.tab{
  font-family:'Orbitron', Arial;
  padding:12px 50px;
  background:transparent;
  border:none;
  color:white;
  cursor:pointer;
  z-index:2;
}

/* MOVING BLOB */
.blob{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  background:#42ff29;
  opacity:0.25;
  border-radius:999px;
  transition:0.35s cubic-bezier(0.22,1,0.36,1);
  z-index:1;
}

/* PAGES */
.page{
  display:none;
}

.page.active{
  display:block;
}

/* DISPLAY */
#display{
  width:360px;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:#181818;
  text-align:center;
}

#display img{
  width:120px;
  height:120px;
  border-radius:50%;
}

/* BUTTON */
.rollBtn{
  padding:18px 70px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#5865F2;
  color:white;
}

/* INVENTORY */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:10px;
  text-align:center;
  min-height:170px;
}

/* RARITIES */
.card.common{box-shadow:0 0 8px gray;}
.card.rare{box-shadow:0 0 12px #4da6ff;}
.card.epic{box-shadow:0 0 18px #b84dff;}
.card.legendary{box-shadow:0 0 25px gold;}
.card.mythic{box-shadow:0 0 35px red;}

.lockedText{font-size:26px;}
.lockedSub{color:#aaa;font-size:14px;}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="hud">

      <div class="hudBox">
        Rolls: <span id="rolls">0</span>
      </div>

      <h1>theos RNG</h1>

      <div class="hudBox">
        Best: <span id="best">None</span>
      </div>

    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">

      <div class="blob" id="blob"></div>

      <button class="tab" onclick="showPage('roll', this)">Roll</button>
      <button class="tab" onclick="showPage('inventory', this)">Inventory</button>

    </div>
  </div>

  <!-- ROLL PAGE -->
  <div id="rollPage" class="page active">

    <div id="display">
      <img id="img" src="">
      <div id="name">Press Roll</div>
      <div id="odds"></div>
    </div>

    <button class="rollBtn" onclick="roll()">ROLL</button>

  </div>

  <!-- INVENTORY -->
  <div id="inventoryPage" class="page">
    <div id="inventory" class="grid"></div>
  </div>

</div>

<script>
const viewers = [
  {name:"duck", odds:2, image:"https://i.pravatar.cc/120?img=1"},
  {name:"alex", odds:4, image:"https://i.pravatar.cc/120?img=2"},
  {name:"mike", odds:8, image:"https://i.pravatar.cc/120?img=3"},
  {name:"john", odds:16, image:"https://i.pravatar.cc/120?img=4"}
];

let inventory = JSON.parse(localStorage.getItem("inv")||"{}");
let rolls = Number(localStorage.getItem("rolls")||0);
let best = JSON.parse(localStorage.getItem("best")) || null;

document.getElementById("rolls").innerText = rolls;

function rarity(o){
  if(o<=5) return "common";
  if(o<=25) return "rare";
  if(o<=100) return "epic";
  if(o<=1000) return "legendary";
  return "mythic";
}

/* NAV */
function showPage(page, btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page+"Page").classList.add("active");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");

  moveBlob(btn);
}

function moveBlob(btn){
  const blob = document.getElementById("blob");
  blob.style.width = btn.offsetWidth + "px";
  blob.style.left = btn.offsetLeft + "px";
}

/* ROLL */
function roll(){
  const v = viewers[Math.floor(Math.random()*viewers.length)];

  document.getElementById("img").src = v.image;
  document.getElementById("name").innerText = v.name;
  document.getElementById("odds").innerText = "1 in " + v.odds;

  inventory[v.name] = (inventory[v.name]||0)+1;

  if(!best || v.odds > best.odds){
    best = v;
    document.getElementById("best").innerText = v.name;
  }

  save();
  render();
}

/* INVENTORY */
function render(){
  let inv = document.getElementById("inventory");
  inv.innerHTML = "";

  for(let v of viewers){
    let owned = inventory[v.name];

    inv.innerHTML += `
      <div class="card ${owned ? rarity(v.odds) : ""}">
        ${owned ? `
          <img src="${v.image}">
          <div>${v.name}</div>
          <div>x${owned}</div>
        ` : `
          <div class="lockedText">???</div>
          <div class="lockedSub">Locked</div>
        `}
      </div>
    `;
  }
}

function save(){
  localStorage.setItem("inv", JSON.stringify(inventory));
  localStorage.setItem("rolls", rolls);
  localStorage.setItem("best", JSON.stringify(best));
}

/* INIT */
render();
window.onload=()=>moveBlob(document.querySelector(".tab"));
</script>

</body>
</html>
