<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>theos RNG</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

.header{
  text-align:center;
  padding:15px;
  background:#111;
  border-bottom:2px solid #222;
}

.stats{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-top:10px;
}

/* ROLL AREA */
.roll-area{
  text-align:center;
  padding:30px;
}

#display{
  width:360px;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:#181818;
  transition:0.3s;
}

#display img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
}

#name{
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

#odds{
  color:#aaa;
}

/* BIGGER ROLL BUTTON UNDER DISPLAY */
.rollBtn{
  padding:18px 60px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#5865F2;
  color:white;
  margin-top:10px;
}

button:hover{
  opacity:0.9;
}

/* PANELS */
.panels{
  display:flex;
  gap:20px;
  padding:20px;
}

.panel{
  flex:1;
  background:#111;
  border-radius:15px;
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  text-align:center;
  padding:10px;
}

.card img{
  width:70px;
  height:70px;
  border-radius:50%;
}

/* RARITY GLOWS */
.common{ box-shadow:0 0 10px gray; }
.rare{ box-shadow:0 0 15px #4da6ff; }
.epic{ box-shadow:0 0 20px #b84dff; }
.legendary{ box-shadow:0 0 25px gold; }
.mythic{ box-shadow:0 0 35px red; }

.collection-item{
  margin:5px 0;
}

.discovered{ color:#7CFF7C; }
.undiscovered{ color:#666; }

</style>
</head>

<body>

<div class="header">
  <h1>Viewer RNG</h1>
  <div class="stats">
    <div>Rolls: <span id="rolls">0</span></div>
    <div>Best: <span id="best">None</span></div>
  </div>
</div>

<div class="roll-area">

  <div id="display">
    <img id="img" src="https://i.pravatar.cc/150">
    <div id="name">Press Roll</div>
    <div id="odds"></div>
  </div>

  <button class="rollBtn" onclick="roll()">ROLL</button>

</div>

<div class="panels">

  <div class="panel">
    <h2>Inventory</h2>
    <div class="grid" id="inv"></div>
  </div>

  <div class="panel">
    <h2>Collection</h2>
    <div id="col"></div>
  </div>

</div>

<script>

/* VIEWERS */
const viewers = [
  {name:"duckwithsunnies", odds:2, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/6ef3b0ef-bc0b-463d-a3d9-1f2a646a534f-profile_image-70x70.png"},
  {name:"ilee_ez", odds:4, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/e0efcfce-7516-4589-9bcf-5c6ec63a8a76-profile_image-70x70.png"},
  {name:"ztatsukii_", odds:8, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/4fd5ffe5-6799-4f4e-b470-f1420f1caee4-profile_image-70x70.jpeg"},
  {name:"Shunkohh", odds:16, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/2a1751b4-a94c-4c97-9fa7-3168b6a2768f-profile_image-70x70.png"},
  {name:"41unc", odds:25, image:"https://cdn.discordapp.com/avatars/820266716537815040/396a0ee557222daf4c58ed975aad5e59.webp?size=1024"},
  {name:"AbyssFDK", odds:50, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/84332b83-3f01-4ce3-9860-abb0a671fb5c-profile_image-70x70.jpeg"},
  {name:"gmdbon", odds:100, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/45da4302-a7a6-4bc8-a320-f7ebac40d84f-profile_image-70x70.png"},
  {name:"midgatal", odds:500, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/bc185f86-30d2-4422-b547-5f4e3c504d54-profile_image-70x70.png"},
  {name:"IVDrale", odds:1000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/6e71f426-65ca-4914-b6e8-0e5499f032cb-profile_image-70x70.png"},
  {name:"Christ_Is_God", odds:5000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/98b31c09-fa8b-4318-88bd-ef8a0443b772-profile_image-70x70.png"},
  {name:"theosGMD", odds:10000, image:"https://static-cdn.jtvnw.net/jtv_user_pictures/0ffc8233-6b32-411e-bfbd-4167c09cc2a2-profile_image-70x70.png"}
];

let inventory = JSON.parse(localStorage.getItem("inv")||"{}");
let discovered = JSON.parse(localStorage.getItem("col")||"[]");
let rolls = Number(localStorage.getItem("rolls")||0);
let best = Number(localStorage.getItem("best")||0);

document.getElementById("rolls").innerText = rolls;

/* RARITY */
function rarity(o){
  if(o<=5) return "common";
  if(o<=25) return "rare";
  if(o<=100) return "epic";
  if(o<=1000) return "legendary";
  return "mythic";
}

/* TRUE RNG */
function pick(){
  const sorted=[...viewers].sort((a,b)=>b.odds-a.odds);
  for(let v of sorted){
    if(Math.floor(Math.random()*v.odds)===0) return v;
  }
  return viewers[0];
}

/* FAST → SLOW ANIMATION */
let running=false;

function roll(){
  if(running) return;
  running=true;

  rolls++;
  document.getElementById("rolls").innerText=rolls;

  let duration = 2500;
  let start = performance.now();

  function frame(time){
    let progress = (time-start)/duration;

    // ease-out (slow at end)
    let speed = Math.max(50, 200 * (1 - progress));

    if(progress < 1){

      let v = viewers[Math.floor(Math.random()*viewers.length)];
      show(v);

      setTimeout(()=>requestAnimationFrame(frame), speed);

    } else {

      let final = pick();
      show(final);
      finish(final);
      running=false;

    }
  }

  requestAnimationFrame(frame);
}

/* SHOW */
function show(v){
  document.getElementById("img").src=v.image;
  document.getElementById("name").innerText=v.name;
  document.getElementById("odds").innerText="1 in "+v.odds;

  document.getElementById("display").className=rarity(v.odds);
}

/* FINISH */
function finish(v){

inventory[v.name]=(inventory[v.name]||0)+1;

if(!discovered.includes(v.name))
discovered.push(v.name);

if(v.odds>best){
best=v.odds;
document.getElementById("best").innerText=v.name+" (1/"+v.odds+")";
}

save();
render();
}

/* INVENTORY SORTED LOW → HIGH RARITY */
function render(){

let inv=document.getElementById("inv");
inv.innerHTML="";

let entries = Object.entries(inventory)
.sort((a,b)=>{
let va=viewers.find(v=>v.name===a[0]).odds;
let vb=viewers.find(v=>v.name===b[0]).odds;
return va - vb;
});

for(let [name,count] of entries){

let v=viewers.find(x=>x.name===name);

inv.innerHTML+=`
<div class="card ${rarity(v.odds)}">
<img src="${v.image}">
<div>${v.name}</div>
<div>1 in ${v.odds}</div>
<div>x${count}</div>
</div>`;
}

let col=document.getElementById("col");
col.innerHTML="";

viewers.forEach(v=>{
col.innerHTML+=`
<div class="${discovered.includes(v.name)?"discovered":"undiscovered"}">
${discovered.includes(v.name)?"✓":"?"} ${v.name} (1/${v.odds})
</div>`;
});

}

function save(){
localStorage.setItem("inv",JSON.stringify(inventory));
localStorage.setItem("col",JSON.stringify(discovered));
localStorage.setItem("rolls",rolls);
localStorage.setItem("best",best);
}

render();

</script>

</body>
</html>
