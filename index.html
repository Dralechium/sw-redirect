<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>theos RNG</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron', Arial, sans-serif;
  background:#0b0b0b;
  color:white;
  overflow:hidden;
}

/* APP */
.app{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
.header{
  width:100%;
  text-align:center;
  padding:15px;
  background:#111;
  border-bottom:2px solid #222;
}

.hud{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

/* NAV */
.nav{
  position:relative;
  display:flex;
  justify-content:center;
  margin:15px 0;
  border:2px solid #42ff29;
  border-radius:999px;
  background:rgba(0,0,0,0.35);
  overflow:hidden;
}

.nav-inner{
  display:flex;
  position:relative;
}

.tab{
  padding:12px 50px;
  background:transparent;
  border:none;
  color:white;
  cursor:pointer;
  z-index:2;
  font-family:'Orbitron';
}

.blob{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  background:#42ff29;
  opacity:0.25;
  border-radius:999px;
  transition:0.3s;
  z-index:1;
}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* DISPLAY */
#display{
  width:360px;
  margin:20px auto;
  padding:20px;
  background:#181818;
  border-radius:15px;
  text-align:center;
}

/* BUTTON */
.rollBtn{
  padding:18px 70px;
  border:none;
  border-radius:12px;
  background:#5865F2;
  color:white;
  cursor:pointer;
}

/* INVENTORY */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:10px;
  border-radius:12px;
  text-align:center;
}

/* locked */
.lockedText{font-size:26px;}
.lockedSub{color:#aaa;font-size:14px;}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="hud">

      <div>Rolls: <span id="rolls">0</span></div>

      <h1>theos RNG</h1>

      <div>Best: <span id="best">None</span></div>

    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">

      <div class="blob" id="blob"></div>

      <button class="tab" onclick="showPage('roll', this)">Roll</button>
      <button class="tab" onclick="showPage('inventory', this)">Inventory</button>

    </div>
  </div>

  <!-- ROLL -->
  <div id="rollPage" class="page active">

    <div id="display">
      <img id="img" width="120">
      <div id="name">Press Roll</div>
      <div id="odds"></div>
    </div>

    <button class="rollBtn" onclick="roll()">ROLL</button>

  </div>

  <!-- INVENTORY -->
  <div id="inventoryPage" class="page">
    <div id="inventory" class="grid"></div>
  </div>

</div>

<script>
const viewers = [
  {name:"duck", odds:2, image:"https://i.pravatar.cc/120?img=1"},
  {name:"alex", odds:4, image:"https://i.pravatar.cc/120?img=2"},
  {name:"mike", odds:8, image:"https://i.pravatar.cc/120?img=3"}
];

let inventory = JSON.parse(localStorage.getItem("inv")||"{}");
let rolls = Number(localStorage.getItem("rolls")||0);
let best = JSON.parse(localStorage.getItem("best")) || null;

document.getElementById("rolls").innerText = rolls;

/* NAV */
function showPage(page, btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page+"Page").classList.add("active");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");

  moveBlob(btn);
}

function moveBlob(btn){
  const blob = document.getElementById("blob");
  blob.style.width = btn.offsetWidth+"px";
  blob.style.left = btn.offsetLeft+"px";
}

/* ROLL */
function roll(){
  let v = viewers[Math.floor(Math.random()*viewers.length)];

  document.getElementById("img").src = v.image;
  document.getElementById("name").innerText = v.name;
  document.getElementById("odds").innerText = "1 in " + v.odds;

  inventory[v.name] = (inventory[v.name]||0)+1;

  if(!best || v.odds > best.odds){
    best = v;
    document.getElementById("best").innerText = v.name;
  }

  save();
  render();
}

/* INVENTORY */
function render(){
  let inv = document.getElementById("inventory");
  inv.innerHTML="";

  for(let v of viewers){
    let owned = inventory[v.name];

    inv.innerHTML += `
      <div class="card">
        ${owned ? `
          <img src="${v.image}" width="70">
          <div>${v.name}</div>
          <div>x${owned}</div>
        ` : `
          <div class="lockedText">???</div>
          <div class="lockedSub">Locked</div>
        `}
      </div>
    `;
  }
}

function save(){
  localStorage.setItem("inv", JSON.stringify(inventory));
  localStorage.setItem("rolls", rolls);
  localStorage.setItem("best", JSON.stringify(best));
}

render();
window.onload=()=>moveBlob(document.querySelector(".tab"));
</script>

</body>
</html>
