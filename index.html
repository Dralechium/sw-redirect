<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>theos RNG</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:'Orbitron', Arial, sans-serif;
  background:#0b0b0b;
  color:white;
  overflow:hidden;
}

/* NAV */
.nav{display:flex;justify-content:center;margin:18px 0;}
.nav-inner{position:relative;display:flex;border:2px solid #42ff29;border-radius:999px;overflow:hidden}
.tab{padding:14px 40px;background:none;border:0;color:white;cursor:pointer}
.blob{position:absolute;height:100%;background:#42ff29;opacity:.25;transition:.3s}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* AUTH */
#auth{
  position:absolute;top:20px;right:20px;
  background:#111;padding:12px;border-radius:10px;
}

/* DISPLAY */
#display{
  width:360px;
  margin:40px auto;
  text-align:center;
  background:#181818;
  padding:20px;
  border-radius:12px;
}

/* BUTTONS */
button{cursor:pointer;font-family:inherit}
.rollBtn{padding:14px 40px;background:#42ff29;border:0}
.autoBtn{padding:14px 40px;background:#444;border:0;color:white}

/* INVENTORY */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:20px}
.card{background:#1a1a1a;padding:10px;border-radius:10px;text-align:center}

/* LEADERBOARD */
#leaderboardPage{padding:20px}

/* hidden */
.hidden{display:none}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-inner">
    <div class="blob" id="blob"></div>
    <button class="tab" onclick="showPage('roll',this)">Roll</button>
    <button class="tab" onclick="showPage('inventory',this)">Inventory</button>
    <button class="tab" onclick="showPage('leaderboard',this)">Leaderboard</button>
  </div>
</div>

<!-- AUTH -->
<div id="auth">
  <input id="email" placeholder="email"><br>
  <input id="password" type="password" placeholder="password"><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
  <div id="authStatus"></div>
</div>

<!-- PAGES -->
<div id="rollPage" class="page active">
  <div id="display">
    <img id="img" width="100">
    <div id="name">Press Roll</div>
    <div id="odds"></div>
  </div>

  <button class="rollBtn" onclick="roll()">ROLL</button>
  <button class="autoBtn" onclick="toggleAuto()">AUTO</button>
</div>

<div id="inventoryPage" class="page">
  <div class="grid" id="inventory"></div>
</div>

<div id="leaderboardPage" class="page">
  <div id="leaderboard"></div>
</div>

<script>
/* ================= SUPABASE ================= */
const supabaseUrl = "https://rzedwbovmsldoufirmeg.supabase.co";
const supabaseKey = "YOUR_KEY_HERE";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ================= STATE ================= */
let user = null;
let rolls = 0;
let inventory = {};
let best = null;
let auto = false;

/* ================= VIEWERS ================= */
const viewers = [
  {name:"duckwithsunnies", odds:2, image:"https://i.pravatar.cc/100"},
  {name:"ilee_ez", odds:4, image:"https://i.pravatar.cc/101"},
  {name:"spaceuk", odds:7500, image:"https://i.pravatar.cc/120"}
];

const rarity = o => o<=8?"common":o<=50?"rare":o<=256?"epic":o<=1000?"legendary":"mythic";

/* ================= AUTH ================= */
async function register(){
  const email = emailInput().value;
  const password = passInput().value;

  const {error} = await supabase.auth.signUp({email,password});
  if(error) return alert(error.message);

  status("Check email!");
}

async function login(){
  const email = emailInput().value;
  const password = passInput().value;

  const {data,error} = await supabase.auth.signInWithPassword({email,password});
  if(error) return alert(error.message);

  user = data.user;
  document.getElementById("auth").style.display="none";

  await loadPlayer();
}

function emailInput(){return document.getElementById("email")}
function passInput(){return document.getElementById("password")}
function status(t){document.getElementById("authStatus").innerText=t}

/* ================= DATA ================= */
async function save(){
  if(!user) return;

  await supabase.from("player_data").upsert({
    user_id:user.id,
    rolls,
    inventory,
    best
  });
}

async function loadPlayer(){
  const {data} = await supabase
    .from("player_data")
    .select("*")
    .eq("user_id",user.id)
    .single();

  if(!data) return;

  rolls = data.rolls || 0;
  inventory = data.inventory || {};
  best = data.best || null;

  render();
}

/* ================= GAME ================= */
function roll(){
  const v = viewers[Math.floor(Math.random()*viewers.length)];

  rolls++;

  inventory[v.name] = (inventory[v.name]||0)+1;

  if(!best || v.odds > best.odds){
    best = v;
  }

  show(v);
  render();
  save();
}

function show(v){
  document.getElementById("img").src = v.image;
  document.getElementById("name").innerText = v.name;
  document.getElementById("odds").innerText = "1 in " + v.odds;
}

/* ================= AUTO ================= */
function toggleAuto(){
  auto = !auto;
  if(auto) autoLoop();
}

function autoLoop(){
  if(!auto) return;
  roll();
  setTimeout(autoLoop,1500);
}

/* ================= UI ================= */
function render(){
  document.getElementById("inventory").innerHTML =
    Object.entries(inventory).map(([k,v]) =>
      `<div class="card">${k}<br>x${v}</div>`
    ).join("");

  if(best){
    console.log("Best:",best.name);
  }
}

/* ================= PAGES ================= */
function showPage(page,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

  document.getElementById(page+"Page").classList.add("active");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
}

/* ================= INIT ================= */
showPage("roll",document.querySelector(".tab"));
</script>

</body>
</html>
